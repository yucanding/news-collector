name: News collector

# 美股突发新闻采集器：每 5-10 分钟拉一次源，机械预筛后写 inbox.json，
# 供 Muse 的推送轮次（实时快讯 / 凌晨扫描 / 盘前简报 / 盘后汇总）读。
# 判断（市值、2 小时硬线、实质性、链接溯源）全部留给 Muse，本 Action 不推送、不判断。
#
# 触发方式（2026-11-23 改为 cron-job.org，GitHub 原生 schedule 已移除）：
#   cron-job.org 上 4 个任务 POST dispatches 触发本 workflow（workflow_dispatch），
#   分档与原 schedule 一致（UTC；美东 = UTC-5，11 月为 EST）：
#     News Collector Hot：  */5  8-16 * * 1-5   美东 03:00-11:00（北京时间 16:00-24:00，Muse 热档）
#     News Collector Day：  */10 16-23 * * 0-5   其余白天时段
#     News Collector Night：*/10 0-7  * * 1-6   凌晨时段
#     News Collector Sat：  */10 15-17 * * 6     周六美东 10:00-13:00（喂周末轮次）
#   GitHub 原生 schedule 已证实不可靠（2026-11-23 查 Actions 历史：7 次运行全 Success，
#   但 #5→#6 间空 4 小时 20 分、#6→#7 间空 3 小时，定时触发本身没触发），故改走 cron-job.org。
# 分钟：仓库公开时标准 runner 免费不限量；若改回私有，每周约 1,134 次运行、每次至少计 1 分钟，
# 每月约 4,900 分钟（超免费档 2,000）。只跑标准库 Python，不装依赖。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 采集并更新 inbox
        run: python3 collector.py

      - name: 看一眼 inbox
        run: |
          python3 -c "import json; d=json.load(open('inbox.json')); print('inbox:', d['counts'], 'sources_ok:', d['sources_ok'], 'errors:', d['errors'])"

      # 有变化才提交；提交失败不报错，下次运行会重试（seen 未落盘时下轮会重捞同一批，不丢不重）
      - name: 提交 inbox / seen
        run: |
          git config user.name "news-collector-bot"
          git config user.email "news-collector-bot@users.noreply.github.com"
          git pull --rebase || true
          git add inbox.json seen.json
          git diff --cached --quiet || git commit -m "collector: update inbox [skip ci]"
          git push || echo "push 失败，下次运行重试"
